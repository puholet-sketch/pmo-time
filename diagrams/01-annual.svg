<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="Универсальный запуск годового Epic">

  <style>
    .t { font: 600 13px Onest, system-ui, sans-serif; fill: #1A1A1A; }
    .s { font: 400 11px Onest, system-ui, sans-serif; fill: #555555; }
    .leg { font: 600 12px Onest, system-ui, sans-serif; fill: #333333; }
    .edge { stroke: #8A0000; stroke-width: 1.75; fill: none; }
    .arr { fill: #8A0000; }
    .lab { font: 600 11px Onest, system-ui, sans-serif; fill: #8A0000; }
    .phase { font: 700 12px Unbounded, Onest, system-ui, sans-serif; fill: #C00000; letter-spacing: 0.04em; }
    .frame { fill: #FAFAFA; stroke: #E8E4E1; stroke-width: 1; }
  </style>


  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="arr"/>
    </marker>
  </defs>

  <rect x="8" y="10" width="14" height="14" rx="2" fill="#FFF0F0" stroke="#C00000" stroke-width="1.5"/><text x="28" y="22" class="leg">Финансы</text>
  <rect x="110" y="10" width="14" height="14" rx="2" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.5"/><text x="130" y="22" class="leg">ПМ / ТД</text>
  <rect x="210" y="10" width="14" height="14" rx="2" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.5"/><text x="230" y="22" class="leg">Исполнители</text>
  <rect x="340" y="10" width="14" height="14" rx="2" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/><text x="360" y="22" class="leg">Решение</text>
  <rect x="440" y="10" width="14" height="14" rx="2" fill="#F3F1EF" stroke="#666666" stroke-width="1.5"/><text x="460" y="22" class="leg">Клиент / вход</text>
  <rect x="580" y="10" width="14" height="14" rx="2" fill="#ECFDF5" stroke="#166534" stroke-width="1.5"/><text x="600" y="22" class="leg">Закрытие</text>
  <line x1="24" y1="40" x2="896" y2="40" stroke="#E8E4E1" stroke-width="1"/>
  <text x="360" y="68" text-anchor="middle" class="phase">ГОДОВОЙ ЗАПУСК EPIC</text>
  <rect x="40" y="90" width="160" height="58" rx="4" fill="#F3F1EF" stroke="#666666" stroke-width="1.75"/><text x="120.0" y="113.0" text-anchor="middle" class="t">Инициатор</text><text x="120.0" y="131.0" text-anchor="middle" class="s">ПМ / ТД / HR / рук.</text>
  <rect x="236" y="90" width="160" height="58" rx="4" fill="#F5F5F5" stroke="#444444" stroke-width="1.75"/><text x="316.0" y="113.0" text-anchor="middle" class="t">Согласующий</text><text x="316.0" y="131.0" text-anchor="middle" class="s">Аккаунт / ОД / ГД</text>
  <path d="M200 119.0 L234 119.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="432" y="90" width="160" height="58" rx="4" fill="#FFF0F0" stroke="#C00000" stroke-width="1.75"/><text x="512.0" y="113.0" text-anchor="middle" class="t">Финансы</text><text x="512.0" y="131.0" text-anchor="middle" class="s">заявка → Epic</text>
  <path d="M396 119.0 L430 119.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="628" y="90" width="160" height="58" rx="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.75"/><text x="708.0" y="113.0" text-anchor="middle" class="t">ПМ</text><text x="708.0" y="131.0" text-anchor="middle" class="s">Story / Subtask</text>
  <path d="M592 119.0 L626 119.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="824" y="90" width="160" height="58" rx="4" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.75"/><text x="904.0" y="113.0" text-anchor="middle" class="t">Исполнители</text><text x="904.0" y="131.0" text-anchor="middle" class="s">Log Work</text>
  <path d="M788 119.0 L822 119.0" class="edge" marker-end="url(#arrow)"/>
  <text x="360" y="190" text-anchor="middle" class="s">Тип Epic зависит от контура: Оценка · Сервис · Собеседования · Downtime / Meeting</text>
</svg>
