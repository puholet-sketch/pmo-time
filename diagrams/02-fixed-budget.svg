  </defs>

  <rect x="8" y="10" width="14" height="14" rx="2" fill="#FFF0F0" stroke="#C00000" stroke-width="1.5"/><text x="28" y="22" class="leg">Финансы</text>
  <rect x="110" y="10" width="14" height="14" rx="2" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.5"/><text x="130" y="22" class="leg">ПМ / ТД</text>
  <rect x="210" y="10" width="14" height="14" rx="2" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.5"/><text x="230" y="22" class="leg">Исполнители</text>
  <rect x="340" y="10" width="14" height="14" rx="2" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/><text x="360" y="22" class="leg">Решение</text>
