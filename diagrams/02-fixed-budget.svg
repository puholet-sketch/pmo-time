  <path d="M600.0 188 L600.0 198" class="edge" marker-end="url(#arrow)"/>
  <rect x="490" y="252" width="220" height="48" rx="4" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.75"/><text x="600.0" y="270.0" text-anchor="middle" class="t">Факт часов</text><text x="600.0" y="288.0" text-anchor="middle" class="s">Исполнители</text>
