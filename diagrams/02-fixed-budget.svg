  <rect x="490" y="148" width="220" height="48" rx="4" fill="#FFF0F0" stroke="#C00000" stroke-width="1.75"/><text x="600.0" y="166.0" text-anchor="middle" class="t">Epic (Реализация)</text><text x="600.0" y="184.0" text-anchor="middle" class="s">Финансы</text>
