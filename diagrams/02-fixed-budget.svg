  <rect x="94" y="164" width="220" height="48" rx="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.75"/><text x="204.0" y="182.0" text-anchor="middle" class="t">Subtask исполнителям</text><text x="204.0" y="200.0" text-anchor="middle" class="s">ПМ / ТД</text>
