  <rect x="490" y="304" width="220" height="52" rx="4" fill="#ECFDF5" stroke="#166534" stroke-width="1.75"/><text x="600.0" y="324.0" text-anchor="middle" class="t">Приёмка · закрытие · акты</text><text x="600.0" y="342.0" text-anchor="middle" class="s">Клиент / Финансы</text>
  <path d="M600.0 292 L600.0 302" class="edge" marker-end="url(#arrow)"/>
  <path d="M314 340 L490 120" class="edge" marker-end="url(#arrow)"/>
  <rect x="410.0" y="220.0" width="89" height="18" rx="2" fill="#fff" stroke="#E8E4E1"/><text x="416.0" y="233.0" class="lab">старт работ</text>
