<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 400" role="img" aria-label="Фикс. бюджет: оценка → реализация">

  <style>
    .t { font: 600 13px Onest, system-ui, sans-serif; fill: #1A1A1A; }
