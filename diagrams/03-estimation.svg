  <rect x="540" y="340" width="260" height="56" rx="4" fill="#ECFDF5" stroke="#166534" stroke-width="1.75"/><text x="670.0" y="362.0" text-anchor="middle" class="t">Отчёты</text><text x="670.0" y="380.0" text-anchor="middle" class="s">план/факт по Epic</text>
