<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" role="img" aria-label="SLA: консультация или эскалация">

  <style>
    .t { font: 600 13px Onest, system-ui, sans-serif; fill: #1A1A1A; }
    .s { font: 400 11px Onest, system-ui, sans-serif; fill: #555555; }
    .leg { font: 600 12px Onest, system-ui, sans-serif; fill: #333333; }
    .edge { stroke: #8A0000; stroke-width: 1.75; fill: none; }
    .arr { fill: #8A0000; }
    .lab { font: 600 11px Onest, system-ui, sans-serif; fill: #8A0000; }
    .phase { font: 700 12px Unbounded, Onest, system-ui, sans-serif; fill: #C00000; letter-spacing: 0.04em; }
    .frame { fill: #FAFAFA; stroke: #E8E4E1; stroke-width: 1; }
  </style>


  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="arr"/>
    </marker>
  </defs>

  <rect x="8" y="10" width="14" height="14" rx="2" fill="#FFF0F0" stroke="#C00000" stroke-width="1.5"/><text x="28" y="22" class="leg">Финансы</text>
  <rect x="110" y="10" width="14" height="14" rx="2" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.5"/><text x="130" y="22" class="leg">ПМ / ТД</text>
  <rect x="210" y="10" width="14" height="14" rx="2" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.5"/><text x="230" y="22" class="leg">Исполнители</text>
  <rect x="340" y="10" width="14" height="14" rx="2" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/><text x="360" y="22" class="leg">Решение</text>
  <rect x="440" y="10" width="14" height="14" rx="2" fill="#F3F1EF" stroke="#666666" stroke-width="1.5"/><text x="460" y="22" class="leg">Клиент / вход</text>
  <rect x="580" y="10" width="14" height="14" rx="2" fill="#ECFDF5" stroke="#166534" stroke-width="1.5"/><text x="600" y="22" class="leg">Закрытие</text>
  <line x1="24" y1="40" x2="856" y2="40" stroke="#E8E4E1" stroke-width="1"/>
  <text x="420" y="64" text-anchor="middle" class="phase">SLA · ДЕРЕВО РЕШЕНИЙ</text>
  <rect x="320.0" y="80" width="200" height="48" rx="4" fill="#F3F1EF" stroke="#666666" stroke-width="1.75"/><text x="420.0" y="98.0" text-anchor="middle" class="t">Обращение клиента</text><text x="420.0" y="116.0" text-anchor="middle" class="s">вход</text>
  <path d="M420 128 L420 146" class="edge" marker-end="url(#arrow)"/>
  <rect x="320.0" y="148" width="200" height="48" rx="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.75"/><text x="420.0" y="166.0" text-anchor="middle" class="t">1-я линия</text><text x="420.0" y="184.0" text-anchor="middle" class="s">Issue в Service Desk</text>
  <path d="M420 196 L420 214" class="edge" marker-end="url(#arrow)"/>
  <polygon points="420,221.0 515.0,248 420,275.0 325.0,248" fill="#FFF7ED" stroke="#B45309" stroke-width="1.75"/><text x="420" y="252" text-anchor="middle" class="t">Консультация?</text>
  <path d="M325 248 H220" class="edge"/>
  <path d="M515 248 H620" class="edge"/>
  <path d="M220 248 V278" class="edge" marker-end="url(#arrow)"/>
  <path d="M620 248 V278" class="edge" marker-end="url(#arrow)"/>
