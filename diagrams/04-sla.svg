  <text x="530" y="240" class="lab">Нет</text>
  <rect x="120.0" y="282" width="200" height="48" rx="4" fill="#ECFDF5" stroke="#166534" stroke-width="1.75"/><text x="220.0" y="300.0" text-anchor="middle" class="t">Ответ + Log Work</text><text x="220.0" y="318.0" text-anchor="middle" class="s">в Issue</text>
  <rect x="520.0" y="282" width="200" height="48" rx="4" fill="#FFF0F0" stroke="#C00000" stroke-width="1.75"/><text x="620.0" y="300.0" text-anchor="middle" class="t">Issue в Epic Сервис</text><text x="620.0" y="318.0" text-anchor="middle" class="s">эскалация</text>
  <path d="M620 330 L620 348" class="edge" marker-end="url(#arrow)"/>
  <polygon points="620,355.0 705.0,380 620,405.0 535.0,380" fill="#FFF7ED" stroke="#B45309" stroke-width="1.75"/><text x="620" y="384" text-anchor="middle" class="t">Тип?</text>
  <path d="M535 380 H480" class="edge"/>
  <path d="M705 380 H760" class="edge"/>
  <path d="M480 380 V410" class="edge" marker-end="url(#arrow)"/>
  <path d="M760 380 V410" class="edge" marker-end="url(#arrow)"/>
  <text x="545" y="372" class="lab">Ошибка</text>
  <text x="680" y="372" class="lab">Доработка</text>
  <rect x="380.0" y="414" width="200" height="48" rx="4" fill="#F8FAFC" stroke="#334155" stroke-width="1.75"/><text x="480.0" y="432.0" text-anchor="middle" class="t">Назначение на QA</text><text x="480.0" y="450.0" text-anchor="middle" class="s">качество</text>
  <rect x="660.0" y="414" width="200" height="48" rx="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="1.75"/><text x="760.0" y="432.0" text-anchor="middle" class="t">ПМ / разработка</text><text x="760.0" y="450.0" text-anchor="middle" class="s">доработка</text>
  <path d="M480 462 V500" class="edge"/>
  <path d="M760 462 V500" class="edge"/>
  <path d="M480 500 H760" class="edge"/>
  <path d="M620.0 500 V518" class="edge" marker-end="url(#arrow)"/>
  <rect x="520.0" y="522" width="200" height="48" rx="4" fill="#EEF6F6" stroke="#0F6B6B" stroke-width="1.75"/><text x="620.0" y="540.0" text-anchor="middle" class="t">Subtask + списание</text><text x="620.0" y="558.0" text-anchor="middle" class="s">исполнители</text>
